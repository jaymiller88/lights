<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Tonight's aurora chase plan — clouds, Kp, moon, driving zones, and a camera + safety playbook. Works offline in the field.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aurora">
  <title>Aurora Chase Copilot</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.svg">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-title">
        <h1>Aurora Chase Copilot</h1>
        <span class="subtitle" id="subtitle">3-Hour Radius</span>
      </div>
      <div class="header-status" id="status-indicator" role="status" aria-live="polite">
        <span class="status-dot"></span>
        <span class="status-text">Ready</span>
      </div>
    </header>

    <!-- Offline banner -->
    <div id="offline-banner" class="offline-banner hidden" role="status">
      <span class="offline-dot"></span>
      <span>Offline — showing your last saved plan. Live weather resumes when you reconnect.</span>
    </div>

    <!-- Command Bar -->
    <nav class="command-bar" aria-label="Actions">
      <button class="cmd-btn cmd-primary" onclick="runPlan()">
        <span class="cmd-icon" aria-hidden="true">&#9733;</span>
        Run tonight's plan
      </button>
      <button class="cmd-btn" onclick="showSettingsModal()">
        <span class="cmd-icon" aria-hidden="true">&#9881;</span>
        Settings
      </button>
      <button class="cmd-btn" onclick="showUpdateModal()">
        <span class="cmd-icon" aria-hidden="true">&#8635;</span>
        Update now
      </button>
      <button class="cmd-btn" onclick="showCameraModal()">
        <span class="cmd-icon" aria-hidden="true">&#9898;</span>
        Camera help
      </button>
      <button class="cmd-btn" onclick="showParking()">
        <span class="cmd-icon" aria-hidden="true">&#9899;</span>
        Safe parking
      </button>
      <button class="cmd-btn" onclick="condensePlan()">
        <span class="cmd-icon" aria-hidden="true">&#9776;</span>
        Condense
      </button>
    </nav>

    <!-- Location Prompt (mobile-friendly; uses user gesture for GPS permission) -->
    <div id="location-prompt" class="location-prompt hidden"></div>

    <!-- Hero verdict readout (empty-state on load, tonight's verdict after a plan runs) -->
    <section id="hero" class="hero" aria-live="polite"></section>

    <!-- Countdown Timer Bar -->
    <div id="countdown-bar" class="countdown-bar hidden">
      <span class="countdown-label">Next</span>
      <span class="countdown-event"></span>
      <span class="countdown-time"></span>
    </div>

    <!-- Loading State -->
    <div id="loading" class="loading hidden">
      <div class="aurora-loader" aria-hidden="true"><span></span><span></span><span></span></div>
      <p>Reading the sky…</p>
      <p class="loading-sub">Pulling met.no clouds + NOAA SWPC aurora for every zone</p>
    </div>

    <!-- Error State -->
    <div id="error" class="error-box hidden" role="alert"></div>

    <!-- Plan Content -->
    <main id="plan-content" class="plan-content hidden"></main>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal(event)" role="dialog" aria-modal="true">
      <div class="modal" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="hideModal()" aria-label="Close">&times;</button>
        <div id="modal-content"></div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    // Register the service worker so the shell + last plan survive dead-zone drives.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
